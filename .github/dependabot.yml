version: 2
updates:
  # Keep Python dependencies current and surface CVEs as PRs.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 8
    labels:
      - "dependencies"
      - "python"
      - "automerge"
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # mcp 2 removes mcp.server.fastmcp; PyPI fastmcp still requires mcp<2
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]

  # Keep GitHub Actions pinned/updated.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "automerge"
    groups:
      actions:
        patterns:
          - "*"

  # Keep Dockerfile base-image pins current (e.g. python:3.12-slim).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
      - "automerge"
