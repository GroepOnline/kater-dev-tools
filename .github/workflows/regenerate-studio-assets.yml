name: Regenerate Studio assets

on:
  push:
    branches:
      - feat/studio-agent-activity-focus-20260901

permissions:
  actions: write
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install Studio dependencies
        run: npm --prefix studio ci --ignore-scripts

      - name: Build Studio assets
        run: npm --prefix studio run build

      - name: Commit generated assets and remove helper
        run: |
          rm .github/workflows/regenerate-studio-assets.yml
          git add src/kater/web/studio_dist .github/workflows/regenerate-studio-assets.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "build(studio): refresh generated assets"
          git push origin "HEAD:${BRANCH}"
          gh workflow run ci.yml --ref "${BRANCH}"
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
