name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (without leading 'v')"
        required: true
        type: string

# Avoid clobbering a release in flight for the same tag/ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # Required to create the GitHub Release and upload assets.
  contents: write
  # Required for PyPI trusted publishing (staged; publish step is disabled).
  id-token: write

jobs:
  release:
    name: Build and publish GitHub Release
    # GitHub-hosted runners banned until Actions spending restored.
    runs-on: fromJSON('["self-hosted","Linux","X64","heavy"]')
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies (frozen)
        run: uv sync --frozen --dev --extra browser

      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::No version resolved (neither tag nor workflow_dispatch input)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (tag: v$VERSION)"

      - name: Fetch mainline for immutable-ancestry check
        run: git fetch --no-tags origin main

      # ── Release-contract gate (release-policy.json + scripts/validate_release.py) ──
      - name: Validate release against policy
        run: |
          # Tag pushes resolve the tag to its commit; workflow_dispatch releases
          # are cut from the current checkout (HEAD), which must sit on main.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            COMMIT="HEAD"
          else
            COMMIT="${{ steps.version.outputs.tag }}"
          fi
          uv run python scripts/validate_release.py \
            "${{ steps.version.outputs.tag }}" \
            --commit "$COMMIT" \
            --main-ref origin/main

      # ── Full lint/type/test gates BEFORE asset build ──────────────────
      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy

      - name: Test
        run: >-
          timeout 480s uv run pytest -vv --tb=short -ra --no-cov
          --ignore=tests/test_computer_acceptance_e2e.py

      - name: Build distributions
        run: uv build

      - name: Validate built artifact version
        run: |
          # uv_build names the wheel/sdist with the project version, so verify
          # the filename pattern carries the resolved version.
          VERSION="${{ steps.version.outputs.version }}"
          shopt -s nullglob
          artifacts=( dist/*.whl dist/*.tar.gz )
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "::error::uv build produced no artifacts"
            exit 1
          fi
          for a in "${artifacts[@]}"; do
            echo "built: $a"
            case "$a" in
              *"$VERSION"*) ;;
              *) echo "::error::Artifact $a does not contain version $VERSION"; exit 1 ;;
            esac
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PRERELEASE=""
          # Development channel (vX.Y.Z.devN) releases are always prereleases.
          if [[ "$TAG" == *".dev"* ]]; then
            PRERELEASE="--prerelease"
            echo "Marking $TAG as prerelease (development channel)"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets only."
          else
            gh release create "$TAG" \
              --generate-notes \
              --notes-file CHANGELOG.md \
              --title "$TAG" \
              $PRERELEASE
          fi

      - name: Upload build artifacts to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release upload "$TAG" dist/*.whl dist/*.tar.gz --clobber

      # TODO(pyPI): Trusted publishing is staged but disabled. To activate:
      #   1. Configure the PyPI publisher for this repo at
      #      https://pypi.org/manage/account/publishing/ (OIDC, ref pattern v*).
      #   2. Remove the comment markers below.
      # - name: Publish to PyPI (trusted publishing)
      #   uses: pypa/gh-action-pypi-publish@release/v1
