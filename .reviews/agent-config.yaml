# Behavior/config for AI coding agents in this repo (analogous to .coderabbit.yaml).
# Human- and machine-readable. Not auto-enforced; agents read this before acting.
version: 1

mode:
  # Prefer decisive action over asking. Do the obvious thing, then report.
  autonomy: eager          # eager | ask-first
  verbosity: terse         # terse | normal | explanatory
  style: code-mode         # minimal prose, show diffs/commands over paragraphs
  language: nl             # match the maintainer; code + identifiers stay en

defaults:
  # What to do without being asked when the intent is clear.
  fix_root_cause: true             # fix the cause, not the symptom
  update_tests_with_code: true     # a code change that breaks a test updates the test
  run_before_claiming_green: true  # never say "passes" without running it
  parallelize_nontrivial: true     # dispatch ~4 disjoint-scope lanes (see AGENTS.md)

guardrails:
  # Repo-specific tripwires. Violating these breaks CI.
  - id: workflow-text-tests
    rule: >-
      .github/workflows/*.yml is asserted by plain-text substrings in
      tests/test_ci_workflow_changes.py. After any workflow edit, grep that test
      for affected substrings and run it.
  - id: cursor-index-generated
    rule: >-
      .cursor/INDEX.md and .cursor/skills/.index.yaml are generated by
      scripts/generate_cursor_index.py. Never hand-edit; regenerate. Adding a
      skill under .cursor/skills/ requires regeneration or the Cursor artifact
      guard (scripts/check_cursor_artifacts.sh) fails the validate job.
  - id: agents-ssot
    rule: >-
      .cursor/ is the SSOT for skills/agents. No mirrored copies under
      .agents/.claude/.codex. Repo docs/logs go in .reviews/, not .agents/.
  - id: no-org-leak
    rule: >-
      No org handle or production domain under .cursor/ (see
      scripts/check_cursor_artifacts.sh). Org-pinned artifacts live in the
      private deployment repo.
  - id: stop-before-smoke
    rule: >-
      ./scripts/smoke.sh runs with the server stopped; ./scripts/e2e-mcp.sh runs
      with it started. See AGENTS.md.

commands:
  verify: uv run ruff check . && uv run mypy && uv run pytest
  workflow_tests: uv run pytest tests/test_ci_workflow_changes.py
  cursor_index: python3 scripts/generate_cursor_index.py
  cursor_guard: bash scripts/check_cursor_artifacts.sh

logging:
  # Where to record durable learnings and per-session notes.
  continual_learning: .reviews/continual-learning.md
  sessions: .reviews/sessions/
  reviews: .reviews/pr-<n>-review.md
